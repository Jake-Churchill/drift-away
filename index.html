<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drift Away</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="resource-bar">
    <div class="resource"><span class="icon">🐟</span><span class="count" id="count-fish">0</span></div>
    <div class="resource"><span class="icon">🌿</span><span class="count" id="count-kelp">0</span></div>
    <div class="resource"><span class="icon">🪵</span><span class="count" id="count-driftwood">0</span></div>
    <div class="resource"><span class="icon">🌾</span><span class="count" id="count-crops">0</span></div>
  </div>
  <div id="tile-panel" class="hidden">
    <button id="tile-panel-close-btn" aria-label="Close">×</button>
    <span id="tile-panel-icon" class="tile-panel-icon"></span>
    <h2 id="tile-panel-name"></h2>
    <p id="tile-panel-desc"></p>
    <div id="tile-panel-progress"></div>
    <button id="tile-panel-unlock-btn" class="hidden">Unlock</button>
  </div>
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu-overlay" class="hidden">
    <div id="menu-panel">
      <h2>Drift Away</h2>
      <div id="menu-main">
        <button id="menu-resume-btn">Resume</button>
        <button id="menu-restart-btn">Restart</button>
        <div id="menu-credits">
          <p>Made by <a href="mailto:warmonkey@jakechurchill.com">warmonkey@jakechurchill.com</a></p>
          <p>🐍 Check out <a href="https://python.jakechurchill.com" target="_blank" rel="noopener">python.jakechurchill.com</a></p>
        </div>
      </div>
      <div id="menu-confirm" class="hidden">
        <p>This will erase all progress. Are you sure?</p>
        <button id="menu-confirm-yes-btn">Yes, restart</button>
        <button id="menu-confirm-no-btn">Cancel</button>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
