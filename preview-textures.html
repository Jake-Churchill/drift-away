<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drift Away — Texture Rebuild Prototype (scratch)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0e2f42; }
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    .panel {
      position: fixed; color: #f4ead2; background: rgba(16, 38, 58, 0.92);
      padding: 10px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.45;
    }
    #controls { top: 10px; left: 10px; width: 330px; max-height: calc(100vh - 20px); overflow-y: auto; }
    #controls h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.02em; }
    .item { display: block; padding: 5px 0; border-top: 1px solid rgba(244, 234, 210, 0.12); cursor: pointer; }
    .item input { margin-right: 6px; vertical-align: middle; }
    .item b { font-weight: 650; }
    .item small { display: block; opacity: 0.7; margin: 1px 0 0 22px; }
    .row { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
    button {
      font: inherit; color: #f4ead2; background: #2b5d7c; border: 1px solid #4b86aa;
      border-radius: 6px; padding: 2px 8px; cursor: pointer;
    }
    button:hover { background: #3a7397; }
    input[type=range] { width: 130px; vertical-align: middle; }
    #stats { top: 10px; right: 10px; font-variant-numeric: tabular-nums; min-width: 210px; }
    #stats b { display: inline-block; min-width: 92px; opacity: 0.75; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="controls" class="panel">
    <h3>Texture rebuild — remaining proposals (water and foam are now in the game)</h3>
    <div class="row">
      <button id="all-on">All after</button><button id="all-off">All before</button>
    </div>
    <label class="item"><input type="checkbox" id="t-deck" checked><b>1. Raft decks</b>
      <small>Planked wood (zone 1) and frosted planks (zone 2) instead of one flat colour.</small></label>
    <label class="item"><input type="checkbox" id="t-detail" checked><b>4. Prop surface detail</b>
      <small>Wood grain, fish scales, stone courses and weave as shared normal maps.</small></label>
    <label class="item"><input type="checkbox" id="t-frost" checked><b>5. Zone-2 frost</b>
      <small>Rime crust, clearcoat and sheen on the ice props.</small></label>
    <label class="item"><input type="checkbox" id="t-env" checked><b>6. Environment lighting</b>
      <small>A generated sky environment plus a hemisphere light, so surfaces catch light instead of looking matte.</small></label>
    <label class="item"><input type="checkbox" id="t-blob" checked><b>7. Contact shadows</b>
      <small>Soft dark pad under every prop to seat it on the deck.</small></label>
    <label class="item"><input type="checkbox" id="t-tone"><b>8. Tone mapping (optional)</b>
      <small>Filmic contrast curve. Changes every colour in the game, so it is off by default.</small></label>
    <label class="item"><input type="checkbox" id="t-clouds" checked><b>Clouds</b>
      <small>Hide them to inspect the water.</small></label>
    <div class="row"><b style="min-width:52px;opacity:.75">View</b>
      <button data-view="zone1">Zone 1</button><button data-view="zone2">Zone 2</button>
      <button data-view="deck">Deck close-up</button><button data-view="props">Props close-up</button>
      <button data-view="ice">Frost close-up</button>
    </div>
    <div class="row"><b style="min-width:52px;opacity:.75">Zoom</b><input type="range" id="zoom" min="0.6" max="4.5" step="0.05" value="1"></div>
  </div>

  <div id="stats" class="panel"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { buildScene } from './js/scene.js';
    import { TILES } from './js/tiles.js';
    import { isDiscovered, getLevel } from './js/state.js';
    import { updateCloudField, renderCloudField } from './js/clouds.js';

    const canvas = document.getElementById('game-canvas');
    const { renderer, scene, camera, resize, waterUniforms, tileObjects, cameraPositions, cloudField } = buildScene(canvas);
    renderer.info.autoReset = false;
    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
    const WALL_HEIGHT = 0.35;
    const HEX_R = 1.6;
    const OFFSET = new THREE.Vector3(14, 16, 14);

    window.addEventListener('resize', () => resize(window.innerWidth, window.innerHeight));
    resize(window.innerWidth, window.innerHeight);

    // ---------------------------------------------------------------- game state (mid-game showcase)
    const state = { unlocked: [], levels: {} };
    TILES.filter((t) => t.zone === 'zone1').forEach((t, i) => { state.unlocked.push(t.id); state.levels[t.id] = (i % 3) + 1; });
    for (let n = 0; n < 20; n++) {
      const next = TILES.find((t) => t.zone === 'zone2' && !state.unlocked.includes(t.id) && isDiscovered(t, state));
      if (!next) break;
      state.unlocked.push(next.id);
      state.levels[next.id] = 1 + (n % 3);
    }
    for (const tile of TILES) {
      const o = tileObjects.get(tile.id);
      const unlocked = state.unlocked.includes(tile.id);
      o.raftMesh.visible = unlocked;
      o.markerMesh.visible = !unlocked && isDiscovered(tile, state);
      for (const lvl of [1, 2, 3]) {
        o.propGroups[lvl].visible = lvl === getLevel(state, tile.id);
        if (o.trimMeshes) o.trimMeshes[lvl].visible = lvl === getLevel(state, tile.id);
      }
      if (o.markerMesh.visible) o.markerMesh.userData.outlineMaterial.opacity = 0.45;
    }

    // ---------------------------------------------------------------- procedural texture toolkit
    // Everything is generated at startup from a few noise functions: no image files to ship or load.
    function rng(seed) {
      let s = seed >>> 0;
      return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    }

    // Periodic value noise: cx x cy lattice cells across the tile, so the result tiles seamlessly.
    function valueNoise(size, cx, cy, seed) {
      const r = rng(seed);
      const lat = new Float32Array(cx * cy);
      for (let i = 0; i < lat.length; i++) lat[i] = r();
      const out = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        const fy = (y / size) * cy, iy = Math.floor(fy), ty = fy - iy, sy = ty * ty * (3 - 2 * ty);
        const y0 = iy % cy, y1 = (iy + 1) % cy;
        for (let x = 0; x < size; x++) {
          const fx = (x / size) * cx, ix = Math.floor(fx), tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
          const x0 = ix % cx, x1 = (ix + 1) % cx;
          const a = lat[y0 * cx + x0], b = lat[y0 * cx + x1], c = lat[y1 * cx + x0], d = lat[y1 * cx + x1];
          const top = a + (b - a) * sx, bottom = c + (d - c) * sx;
          out[y * size + x] = top + (bottom - top) * sy;
        }
      }
      return out;
    }

    function fbm(size, cx, cy, octaves, seed, gain = 0.5) {
      const out = new Float32Array(size * size);
      let amp = 1, total = 0;
      for (let o = 0; o < octaves; o++) {
        const n = valueNoise(size, cx << o, cy << o, seed + o * 101);
        for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
        total += amp; amp *= gain;
      }
      for (let i = 0; i < out.length; i++) out[i] /= total;
      return out;
    }

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const mix = (a, b, t) => a + (b - a) * t;

    function makeTexture(data, size, { srgb = false, repeat = [1, 1] } = {}) {
      const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.generateMipmaps = true;
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.magFilter = THREE.LinearFilter;
      t.anisotropy = MAX_ANISO;
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.repeat.set(repeat[0], repeat[1]);
      t.needsUpdate = true;
      return t;
    }

    // Height field -> tangent-space normal map (green up), wrapping at the edges so it tiles.
    function normalFromHeight(h, size, strength) {
      const data = new Uint8Array(size * size * 4);
      for (let y = 0; y < size; y++) {
        const yu = (y - 1 + size) % size, yd = (y + 1) % size;
        for (let x = 0; x < size; x++) {
          const xl = (x - 1 + size) % size, xr = (x + 1) % size;
          const dx = (h[y * size + xr] - h[y * size + xl]) * strength;
          const dy = (h[yd * size + x] - h[yu * size + x]) * strength;
          const inv = 1 / Math.hypot(dx, dy, 1);
          const i = (y * size + x) * 4;
          data[i] = (-dx * inv * 0.5 + 0.5) * 255;
          data[i + 1] = (-dy * inv * 0.5 + 0.5) * 255;
          data[i + 2] = (inv * 0.5 + 0.5) * 255;
          data[i + 3] = 255;
        }
      }
      return data;
    }

    function grayData(values, size) {
      const data = new Uint8Array(size * size * 4);
      for (let i = 0; i < size * size; i++) {
        const v = clamp01(values[i]) * 255;
        data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = v;
        data[i * 4 + 3] = 255;
      }
      return data;
    }

    // ---------------------------------------------------------------- 1. raft deck textures
    function deckSet(zone) {
      const N = 512, PLANKS = 6;
      const frozen = zone === 'zone2';
      const grain = fbm(N, 3, 56, 3, frozen ? 23 : 11);
      const fine = fbm(N, 6, 120, 2, 31);
      const frost = fbm(N, 14, 14, 4, 47);
      const knots = fbm(N, 5, 5, 2, 59);
      const r = rng(frozen ? 9 : 5);
      const tone = [], joint = [];
      for (let p = 0; p < PLANKS; p++) { tone.push(0.9 + r() * 0.2); joint.push(Math.floor(r() * N)); }
      const base = frozen ? [176, 208, 222] : [206, 156, 96];
      const dark = frozen ? [104, 146, 170] : [124, 84, 46];
      const gapCol = frozen ? [48, 78, 100] : [58, 40, 24];
      const height = new Float32Array(N * N);
      const rough = new Float32Array(N * N);
      const albedo = new Uint8Array(N * N * 4);
      for (let y = 0; y < N; y++) {
        const pf = (y / N) * PLANKS, p = Math.min(PLANKS - 1, Math.floor(pf)), py = pf - p;
        for (let x = 0; x < N; x++) {
          const i = y * N + x;
          const g = grain[i] * 0.6 + fine[i] * 0.4;
          const jx = (x - joint[p] + N) % N;
          const gapY = smooth(0.0, 0.05, py) * smooth(0.0, 0.05, 1 - py);
          const gapX = smooth(0, 4, jx);
          const solid = gapY * gapX;
          let cr = mix(dark[0], base[0], g) * tone[p];
          let cg = mix(dark[1], base[1], g) * tone[p];
          let cb = mix(dark[2], base[2], g) * tone[p];
          const knot = smooth(0.7, 0.78, knots[i]);
          cr *= 1 - knot * 0.35; cg *= 1 - knot * 0.35; cb *= 1 - knot * 0.35;
          let rgh = 0.86 - g * 0.12;
          if (frozen) {
            const f = smooth(0.54, 0.74, frost[i] + (1 - solid) * 0.2);
            cr = mix(cr, 238, f * 0.85); cg = mix(cg, 248, f * 0.85); cb = mix(cb, 255, f * 0.85);
            rgh = mix(rgh, 0.5, f);
          }
          // a nail near each butt joint, centred in the plank
          const nail = smooth(4.2, 2.2, Math.hypot((jx - 16 + N) % N, (py - 0.5) * (N / PLANKS)));
          cr = mix(cr, gapCol[0] * 0.8, nail * 0.7); cg = mix(cg, gapCol[1] * 0.8, nail * 0.7); cb = mix(cb, gapCol[2] * 0.8, nail * 0.7);
          cr = mix(gapCol[0], cr, solid); cg = mix(gapCol[1], cg, solid); cb = mix(gapCol[2], cb, solid);
          height[i] = solid * (0.55 + g * 0.45);
          rough[i] = rgh;
          albedo[i * 4] = clamp01(cr / 255) * 255;
          albedo[i * 4 + 1] = clamp01(cg / 255) * 255;
          albedo[i * 4 + 2] = clamp01(cb / 255) * 255;
          albedo[i * 4 + 3] = 255;
        }
      }
      const rep = [0.5, 0.5];
      return {
        map: makeTexture(albedo, N, { srgb: true, repeat: rep }),
        normal: makeTexture(normalFromHeight(height, N, 5), N, { repeat: rep }),
        rough: makeTexture(grayData(rough, N), N, { repeat: rep }),
      };
    }

    // ---------------------------------------------------------------- 4/5. shared prop detail textures
    function detailSet(kind, repeat) {
      const N = 256;
      let h, rough, strength = 3;
      if (kind === 'wood') {
        const g = fbm(N, 22, 2, 3, 71), fine = fbm(N, 60, 4, 2, 73);
        h = g.map((v, i) => v * 0.7 + fine[i] * 0.3);
        rough = h.map((v) => 0.72 + v * 0.28);
        strength = 4;
      } else if (kind === 'weave') {
        const n = fbm(N, 8, 8, 2, 83);
        h = new Float32Array(N * N);
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const a = Math.sin((x / N) * Math.PI * 2 * 10), b = Math.sin((y / N) * Math.PI * 2 * 10);
          h[y * N + x] = 0.5 + 0.35 * a * b + (n[y * N + x] - 0.5) * 0.3;
        }
        rough = h.map((v) => 0.7 + v * 0.25);
        strength = 3;
      } else if (kind === 'bricks') {
        const n = fbm(N, 10, 10, 3, 89);
        h = new Float32Array(N * N);
        const rows = 8, rowH = N / rows, bw = N / 4;
        for (let y = 0; y < N; y++) {
          const row = Math.floor(y / rowH), ry = (y % rowH) / rowH;
          for (let x = 0; x < N; x++) {
            const bx = ((x + (row % 2) * (bw / 2)) % bw) / bw;
            const mortar = smooth(0, 0.07, ry) * smooth(0, 0.07, 1 - ry) * smooth(0, 0.05, bx) * smooth(0, 0.05, 1 - bx);
            h[y * N + x] = mortar * (0.6 + n[y * N + x] * 0.4);
          }
        }
        rough = h.map((v) => 0.75 + (1 - v) * 0.2);
        strength = 5;
      } else if (kind === 'scales') {
        h = new Float32Array(N * N);
        const s = 32;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          let best = 0;
          for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
            const row = Math.floor(y / (s * 0.5)) + j, col = Math.floor(x / s) + i;
            const cx = col * s + (((row % 2) + 2) % 2) * (s / 2) + s / 2, cy = row * (s * 0.5) + s * 0.25;
            const d = Math.hypot(x - cx, y - cy) / (s * 0.62);
            const v = (1 - d) + row * 0.02 * 0;
            if (v > best) best = v;
          }
          h[y * N + x] = clamp01(best);
        }
        rough = h.map((v) => 0.55 + (1 - v) * 0.3);
        strength = 3.2;
      } else { // frost
        const c = fbm(N, 12, 12, 4, 91), sp = fbm(N, 64, 64, 1, 93);
        h = c.map((v, i) => Math.pow(v, 1.6) * 0.85 + sp[i] * 0.15);
        rough = h.map((v) => 0.35 + smooth(0.2, 0.5, v) * 0.55);
        strength = 3.5;
      }
      return {
        normal: makeTexture(normalFromHeight(h, N, strength), N, { repeat }),
        rough: makeTexture(grayData(rough, N), N, { repeat }),
      };
    }

    // ---------------------------------------------------------------- 7. contact blob
    function blobTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
      g.addColorStop(0, 'rgba(20,14,8,0.55)');
      g.addColorStop(0.55, 'rgba(20,14,8,0.28)');
      g.addColorStop(1, 'rgba(20,14,8,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    // ---------------------------------------------------------------- 6. generated sky environment
    function skyEnvironment() {
      const sky = new THREE.Scene();
      sky.add(new THREE.Mesh(
        new THREE.SphereGeometry(50, 48, 24),
        new THREE.ShaderMaterial({
          side: THREE.BackSide,
          vertexShader: 'varying vec3 vP; void main() { vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
          fragmentShader: `varying vec3 vP; void main() {
            float h = vP.y;
            vec3 top = vec3(0.30, 0.52, 0.86), hor = vec3(0.90, 0.92, 0.90), bot = vec3(0.05, 0.16, 0.24);
            vec3 c = h > 0.0 ? mix(hor, top, pow(h, 0.55)) : mix(hor * 0.5, bot, pow(-h, 0.5));
            gl_FragColor = vec4(c, 1.0);
          }`,
        })
      ));
      const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(9, 8, 6) }));
      sun.position.set(10, 16, 6).normalize().multiplyScalar(42);
      sky.add(sun);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const target = pmrem.fromScene(sky, 0.02);
      pmrem.dispose();
      return target.texture;
    }

    // ---------------------------------------------------------------- build everything once
    const genStart = performance.now();
    const T = {
      deck1: deckSet('zone1'),
      deck2: deckSet('zone2'),
      detail: {
        wood: detailSet('wood', [1, 1]),
        weave: detailSet('weave', [2, 2]),
        bricks: detailSet('bricks', [2, 3]),
        scales: detailSet('scales', [3, 2]),
        frost: detailSet('frost', [2, 2]),
      },
      blob: blobTexture(),
      env: skyEnvironment(),
    };

    const genMs = performance.now() - genStart;

    // ---- 1. deck materials (two shared materials replace 72 per-raft ones)
    const deckMaterials = {};
    for (const [zone, set] of [['zone1', T.deck1], ['zone2', T.deck2]]) {
      deckMaterials[zone] = new THREE.MeshStandardMaterial({
        map: set.map, normalMap: set.normal, roughnessMap: set.rough,
        normalScale: new THREE.Vector2(1.1, 1.1), roughness: 1, metalness: 0.03,
      });
    }
    const origRaftMaterial = new Map();
    for (const tile of TILES) origRaftMaterial.set(tile.id, tileObjects.get(tile.id).raftMesh.material);

    // ---- 7. contact shadow pads
    const blobMaterial = new THREE.MeshBasicMaterial({ map: T.blob, transparent: true, depthWrite: false, opacity: 0.85 });
    const blobs = [];
    for (const tile of TILES) {
      const raft = tileObjects.get(tile.id).raftMesh;
      const size = tile.family === 'booster' ? 3.0 : 2.3;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), blobMaterial);
      m.rotation.x = -Math.PI / 2;
      m.position.y = WALL_HEIGHT + 0.006;
      raft.add(m);
      blobs.push(m);
    }

    // ---- 4/5. prop detail + frost. Collect the standard materials on every prop once.
    function categoryFor(tile) {
      if (tile.zone === 'zone2') return 'frost';
      if (tile.family === 'fish') return 'scales';
      if (tile.family === 'kelp' || tile.family === 'crops') return 'weave';
      if (tile.family === 'driftwood') return 'wood';
      if (tile.id.endsWith('lighthouse')) return 'bricks';
      if (tile.id.endsWith('net_weavers')) return 'weave';
      return 'wood';
    }
    const detailEntries = []; // { mesh, mat, kind, orig }
    const seenMaterials = new Set();
    for (const tile of TILES) {
      const kind = categoryFor(tile);
      for (const lvl of [1, 2, 3]) {
        tileObjects.get(tile.id).propGroups[lvl].traverse((o) => {
          const m = o.material;
          if (!o.isMesh || !m || !m.isMeshStandardMaterial) return;
          if (m.transparent || m.metalness >= 0.5 || (m.emissiveIntensity > 0 && m.emissive.getHex() !== 0)) return;
          detailEntries.push({ mesh: o, mat: m, kind, zone: tile.zone, origMesh: m });
          seenMaterials.add(m);
        });
      }
    }
    const origMap = new Map([...seenMaterials].map((m) => [m, { normalMap: m.normalMap, roughnessMap: m.roughnessMap, normalScale: m.normalScale.clone() }]));

    const physicalFor = new Map();
    function frostMaterial(m) {
      if (!physicalFor.has(m)) {
        physicalFor.set(m, new THREE.MeshPhysicalMaterial({
          color: m.color, roughness: m.roughness, metalness: m.metalness, flatShading: m.flatShading, side: m.side,
          clearcoat: 0.55, clearcoatRoughness: 0.28, sheen: 0.7, sheenColor: new THREE.Color(0xd6f0ff), sheenRoughness: 0.45,
          normalMap: T.detail.frost.normal, roughnessMap: T.detail.frost.rough, normalScale: new THREE.Vector2(1.1, 1.1),
        }));
      }
      return physicalFor.get(m);
    }

    const DETAIL_STRENGTH = { wood: 1.1, weave: 0.9, bricks: 1.0, scales: 1.2, frost: 1.1 };
    let detailOn = true, frostOn = true;
    function refreshProps() {
      for (const e of detailEntries) {
        const m = e.mat, o = origMap.get(m);
        const useFrostMaterial = e.zone === 'zone2' && frostOn;
        e.mesh.material = useFrostMaterial ? frostMaterial(m) : m;
        if (detailOn) {
          const d = T.detail[e.kind];
          m.normalMap = d.normal; m.roughnessMap = d.rough;
          m.normalScale.set(DETAIL_STRENGTH[e.kind], DETAIL_STRENGTH[e.kind]);
        } else {
          m.normalMap = o.normalMap; m.roughnessMap = o.roughnessMap; m.normalScale.copy(o.normalScale);
        }
        m.needsUpdate = true;
      }
    }

    // ---- 6. lighting
    const ambient = scene.children.find((o) => o.isAmbientLight);
    const ambientBase = ambient.intensity;
    const hemi = new THREE.HemisphereLight(0xdcefff, 0x1c4c68, 0.0);
    scene.add(hemi);

    // ---------------------------------------------------------------- toggles
    const ui = (id) => document.getElementById(id);
    function applyDeck(on) {
      for (const tile of TILES) tileObjects.get(tile.id).raftMesh.material = on ? deckMaterials[tile.zone] : origRaftMaterial.get(tile.id);
    }
    function applyEnv(on) {
      scene.environment = on ? T.env : null;
      scene.environmentIntensity = 0.6;
      ambient.intensity = on ? ambientBase * 0.45 : ambientBase;
      hemi.intensity = on ? 0.55 : 0;
      for (const m of [deckMaterials.zone1, deckMaterials.zone2]) m.needsUpdate = true;
      for (const m of seenMaterials) m.needsUpdate = true;
    }
    function applyTone(on) {
      renderer.toneMapping = on ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
      renderer.toneMappingExposure = 1.05;
      scene.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => { m.needsUpdate = true; }); });
    }
    let blobOn = true, cloudsOn = true;

    const handlers = {
      't-deck': applyDeck,
      't-detail': (on) => { detailOn = on; refreshProps(); },
      't-frost': (on) => { frostOn = on; refreshProps(); },
      't-env': applyEnv,
      't-blob': (on) => { blobOn = on; for (const b of blobs) b.visible = on; },
      't-tone': applyTone,
      't-clouds': (on) => { cloudsOn = on; },
    };
    for (const [id, fn] of Object.entries(handlers)) {
      ui(id).addEventListener('change', (e) => fn(e.target.checked));
      fn(ui(id).checked);
    }
    const setAll = (on) => { for (const id of Object.keys(handlers)) { if (id === 't-tone' || id === 't-clouds') continue; ui(id).checked = on; handlers[id](on); } };
    ui('all-on').addEventListener('click', () => setAll(true));
    ui('all-off').addEventListener('click', () => setAll(false));

    // ---------------------------------------------------------------- views
    function setView(target, zoom) {
      camera.position.copy(target).add(OFFSET);
      camera.zoom = zoom;
      camera.updateProjectionMatrix();
      camera.lookAt(target);
      ui('zoom').value = zoom;
      currentTarget.copy(target);
    }
    const currentTarget = new THREE.Vector3();
    const pos = (id) => tileObjects.get(id).raftMesh.position.clone();
    const propsTile = TILES.find((t) => t.id === 'booster_windmill') ? 'booster_windmill' : 'driftwood_start';
    const VIEWS = {
      zone1: () => setView(cameraPositions.get('zone1').target.clone(), 1),
      zone2: () => setView(cameraPositions.get('zone2').target.clone(), 1),
      deck: () => setView(pos('driftwood_start').add(new THREE.Vector3(1.2, 0, 1.4)), 3.6),
      props: () => setView(pos(propsTile).add(new THREE.Vector3(0, 0.8, 0)), 2.6),
      ice: () => setView(pos(state.unlocked.filter((id) => id.startsWith('frozen_'))[2]).add(new THREE.Vector3(0, 0.8, 0)), 2.6),
    };
    document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => VIEWS[b.dataset.view]()));
    ui('zoom').addEventListener('input', (e) => { setView(currentTarget.clone(), Number(e.target.value)); });
    VIEWS.zone1();

    // ---------------------------------------------------------------- loop
    let lastStats = 0;

    function loop(now) {
      renderer.info.reset();
      const t = now / 1000;
      waterUniforms.uTime.value = t;

      updateCloudField(cloudField, state.unlocked, now);
      renderer.render(scene, camera);
      if (cloudsOn) renderCloudField(renderer, cloudField, camera);

      if (now - lastStats > 400) {
        lastStats = now;
        const mats = new Set();
        const keyOf = (m) => [m.type, m.color && m.color.getHex(), m.roughness, m.metalness, m.side, m.transparent, m.opacity, m.emissive && m.emissive.getHex(), m.flatShading, m.normalMap && m.normalMap.id, m.map && m.map.id].join('|');
        const walk = (o, fn) => { if (!o.visible) return; fn(o); for (const c of o.children) walk(c, fn); };
        walk(scene, (o) => { if (o.material) for (const m of [].concat(o.material)) mats.add(m); });
        const looks = new Set([...mats].map(keyOf));
        // If every prop group were merged into one mesh per distinct look, this is what would be left to draw.
        let merged = 0;
        for (const tile of TILES) {
          const obj = tileObjects.get(tile.id);
          if (!obj.raftMesh.visible) continue;
          merged += 1;
          const keys = new Set();
          for (const lvl of [1, 2, 3]) walk(obj.propGroups[lvl], (o) => { if (o.isMesh) keys.add(keyOf(o.material)); });
          merged += keys.size;
        }
        ui('stats').innerHTML =
          `<b>Draw calls</b>${renderer.info.render.calls}<br>` +
          `<b>Triangles</b>${renderer.info.render.triangles.toLocaleString()}<br>` +
          `<b>Materials</b>${mats.size} objects, ${looks.size} distinct<br>` +
          `<b>If merged</b>~${merged} draws (main pass)<br>` +
          `<b>Textures</b>${renderer.info.memory.textures} on GPU`;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__p = { setAll, VIEWS, ui, genMs };
  </script>
</body>
</html>
